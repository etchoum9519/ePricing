function isDateValue(value) {
    if (value === null || value === undefined) return false;

    if (
        typeof value === "number" &&
        value > 30000 &&
        value < 60000
    ) {
        return true;
    }

    const str = String(value).trim();

    return (
        /^\d{2}\.\d{4}$/.test(str) ||                // MM.YYYY
        /^\d{2}\.\d{2}\.\d{4}$/.test(str) ||
        /^\d{2}\.\d{2}\.\d{4}\s+\d{2}:\d{2}$/.test(str) ||
        /^\d{4}-\d{2}-\d{2}$/.test(str) ||
        /^\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}$/.test(str) ||
        /^\d{2}\/\d{2}\/\d{4}$/.test(str)
    );
}

function getGasYear(date) {
    const shifted = new Date(date);
    shifted.setHours(shifted.getHours());
    return shifted.getFullYear();
}
        
function parseGermanNumber(value) {

    if (value === null || value === undefined) {
        return NaN;
    }

    const str = String(value).trim();

    // deutsches Format
    if (str.includes(",")) {
        return Number(
            str
                .replace(/\./g, "")
                .replace(",", ".")
        );
    }

    // Excel / JS Rohzahl
    return Number(str);
}
        
function validateRawInputStrict(text) {

    const lines = text
        .split("\n")
        .map(l => l.trim())
        .filter(Boolean);

    if (lines.length === 0) {
        return { ok: false, reason: "Leere Eingabe" };
    }

    for (const line of lines) {
    
        const parts = line.split(/[;\t]+/);
    
        if (parts.length < 2) {
            continue; // zu wenig Spalten
        }
    
        const last = parts[parts.length - 1];
    
        // 🔥 WICHTIG: Zeitstempel explizit ignorieren
        if (isDateValue(parts[0])) {
            const value = parseGermanNumber(last);
    
            if (!Number.isFinite(value)) {
                const err = new Error(
                    `Invalid numeric dataset → "${last}" ist keine gültige Zahl`
                );
                err.code = "INVALID_DATASET";
                throw err;
            }
        }
    }

    return { ok: true };
}

            function removeHeaderFromRawInput() {
            
                let lines = rawInput.value
                    .split(/\r?\n/)
                    .map(l => l.trim());
            
                while (lines.length && lines[0] === "") {
                    lines.shift();
                }
            
                if (!lines.length) return;
            
                const row0 = lines[0].split(/[;\t]+/);
            
                const candidate =
                    row0.length > 1
                        ? row0[1].trim()
                        : row0[0].trim();
            
                const isHeader =
                    isNaN(parseGermanNumber(candidate)) &&
                    !isDateValue(candidate);
            
                if (isHeader) {
            
                    lines.shift();
            
                    rawInput.value = lines.join("\n");
            
                    if (!headerWarningShown) {
            
                        alert(
                            "Spaltenname erkannt. Erste Zeile wurde automatisch entfernt."
                        );

            rawInput.addEventListener("paste", function (e) {

                let text =
                    (e.clipboardData || window.clipboardData)
                    .getData("text");
            
                text = text.replace(/[\r\n]+$/g, "");
            
                const start = this.selectionStart;
                const end = this.selectionEnd;
            
                this.value =
                    this.value.substring(0, start) +
                    text +
                    this.value.substring(end);
            
                this.selectionStart =
                    this.selectionEnd =
                    start + text.length;
            
                removeHeaderFromRawInput();
                
                this.dispatchEvent(
                    new Event("input", { bubbles: true })
                );

                    sumInfoText.textContent =
    "wird berechnet nach Upload-Bestätigung";

function calculateSum() {

    const text = rawInput.value;

    const lines = text
        .split("\n")
        .map(l => l.trim())
        .filter(l => l.length > 0);

    const values = [];

    const forwardFactor =
        parseFloat(
            document.querySelector(
                'input[name="forward_market_share"]'
            ).value || 100
        ) / 100;

    const unit =
        document.querySelector('select[name="unit"]').value;

    const selectedYears =
        Array.from(
            document.querySelector('select[name="years"]').selectedOptions
        ).map(o => Number(o.value));
    
    const yearCount =
        Math.max(selectedYears.length, 1);
    
    const valueCount = values.length;
    
    let singleColumnGranularity = "1h";
    
    if (valueCount <= 12 * yearCount + 2) {
    
        singleColumnGranularity = "1M";
    
    } else if (valueCount <= 366 * yearCount + 2) {
    
        singleColumnGranularity = "1D";
    
    } else {
    
        singleColumnGranularity = "1h";
    
    }    

    for (let i = 0; i < lines.length; i++) {
    
        const parts = lines[i].split(/[;\t]+/);
    
        // Nur Wert ohne Zeitstempel
        if (parts.length === 1) {
    
            const value = parseGermanNumber(parts[0]);
    
            if (!isNaN(value)) {
                values.push(value * forwardFactor);
            }
    
            continue;
        }
    
        // Datum + Wert
        if (parts.length < 2) continue;
    
        if (i === 0) {
    
            const maybeNumber =
                parseGermanNumber(parts[parts.length - 1]);
    
            if (isNaN(maybeNumber)) {
                continue;
            }
        }
    
        const value =
            parseGermanNumber(parts[parts.length - 1]);
    
        if (!isNaN(value)) {
            values.push(value * forwardFactor);
        }
    }
    
    let result = 0;
    
    if (unit === "kWh" || unit === "MWh") {
    
        result = 0;
    
        for (let i = 0; i < values.length; i++) {
    
            const parts = lines[i].split(/[;\t]+/);
    
            const date = parseGermanDate(parts[0]);
            
            // Kein Zeitstempel -> Wert direkt als Energie übernehmen
            if (!date) {
            
                if (unit === "kWh") {
                    result += values[i] ;
                } else {
                    result += values[i];
                }
            
                continue;
            }
    
    
            // Monatswerte sind bereits Energie
            if (/^\d{2}\.\d{4}$/.test(parts[0])) {
    
                if (unit === "kWh") {
                    result += values[i] ;
                } else {
                    result += values[i];
                }
    
                continue;
            }
    
    
            // normale Energieeinheiten
            if (unit === "kWh") {
                result += values[i];
            } else {
                result += values[i];
            }
        }
    
    
} else if (unit === "kW" || unit === "MW") {

    const sorted = [...values].sort((a, b) => a - b);

    const mid = Math.floor(sorted.length / 2);

    result =
        sorted.length % 2
            ? sorted[mid]
            : (sorted[mid - 1] + sorted[mid]) / 2;
}
    if (unit === "kWh" || unit === "MWh") {

        sumInfoText.textContent =
            "Energie wurde aggregiert";
    
    } else if (unit === "kW" || unit === "MW") {
    
        sumInfoText.textContent =
            "Tagesstundenanzahl und Zeitumstellungen wurden berücksichtigt";
    }
    const decimals = getSumDecimalsByUnit(unit);
    
    let display =
        result.toLocaleString("de-DE", {
            minimumFractionDigits: decimals,
            maximumFractionDigits: decimals
        }) + " " + unit;
        
    if (unit === "kW" || unit === "MW") {
    
        let totalHours = 0;
    
        for (let i = 1; i < lines.length; i++) {
    
            const prevParts = lines[i - 1].split(/[;\t]+/);
            const currParts = lines[i].split(/[;\t]+/);
    
            const d1 = parseGermanDate(prevParts[0]);
            const d2 = parseGermanDate(currParts[0]);
    
            if (d1 && d2) {
                totalHours += (d2 - d1) / 3600000;
            }
        }
    
        if (lines.length > 1) {
const firstParts = lines[0].split(/[;\t]+/);
const lastParts  = lines[lines.length - 1].split(/[;\t]+/);

const start = parseGermanDate(firstParts[0]);
const end   = parseGermanDate(lastParts[0]);

let totalHours = 0;

if (start && end && lines.length > 1) {

    const secondParts = lines[1].split(/[;\t]+/);
    const second = parseGermanDate(secondParts[0]);

    // Länge eines Messintervalls (1 h, 24 h, Monat ...)
    const intervalHours = (second - start) / 3600000;

    // Zeitraum vom ersten bis letzten Zeitstempel
    totalHours =
        (end - start) / 3600000 + intervalHours;
}
        }
    
let energyMWh = 0;

for (let i = 0; i < values.length; i++) {

    const parts = lines[i].split(/[;\t]+/);

    // Nur Werte ohne Zeitstempel
    if (parts.length === 1) {
    
        if (unit === "kW") {
            // Annahme: Stundenlastgang
            energyMWh += values[i] / 1000;
        } else if (unit === "MW") {
            // Annahme: Stundenlastgang
            energyMWh += values[i];
        } else {
            // kWh/MWh sind bereits Energie
            energyMWh += values[i];
        }
    
        continue;
    }

    const current = parseGermanDate(parts[0]);
    
    if (!current) {
    
        // Nur reine Monatsnamen (Aug, Sep, ...)
        if (/^[A-Za-zÄÖÜäöü]{3,}$/.test(parts[0].trim())) {
    
            let intervalHours = 730;
    
            if (unit === "kW") {
                energyMWh += values[i] * intervalHours / 1000;
            } else if (unit === "MW") {
                energyMWh += values[i] * intervalHours;
            } else {
                energyMWh += values[i];
            }
    
            continue;
        }
    
        // Alle anderen Datumsformate unverändert behandeln
        continue;
    }

let intervalHours = 0;

// Monatsprofil?
if (/^\d{2}\.\d{4}$/.test(parts[0])) {

    const month = current.getMonth();
    const year = current.getFullYear();

    const monthStart = new Date(year, month, 1);
    const nextMonthStart = new Date(year, month + 1, 1);

    intervalHours = (nextMonthStart - monthStart) / 3600000;

} else if (!parts[0].includes(":")) {

    // ===============================
    // GAS TAGESLASTGANG
    // Datum = Beginn Gastag 06:00
    // Intervall ergibt sich aus nächstem Gastag
    // ===============================

    intervalHours = 24;

    if (i < lines.length - 1) {

        const nextParts = lines[i + 1].split(/[;\t]+/);
        const nextDate = parseGermanDate(nextParts[0]);

        if (nextDate) {

            const currentGasDate = new Date(current);

            // Stromtag beginnt um 00:00
            currentGasDate.setHours(0,0,0,0);

            const nextGasDate = new Date(nextDate);

            nextGasDate.setHours(0,0,0,0);


            intervalHours =
                (nextGasDate - currentGasDate) / 3600000;


            /*
             Sicherheit:
             Normaler Gastag       = 24
             Sommerzeitumstellung  = 23
             Winterzeitumstellung  = 25
            */

            if (
                intervalHours !== 23 &&
                intervalHours !== 24 &&
                intervalHours !== 25
            ) {
                intervalHours = 24;
            }
        }

    } else {

        // letzter Wert bekommt Standardintervall
        intervalHours = 24;
    }


} else {

    // Stundenprofil
    if (i < lines.length - 1) {

        const nextParts = lines[i + 1].split(/[;\t]+/);
        const next = parseGermanDate(nextParts[0]);

        if (next) {
            intervalHours = (next - current) / 3600000;
        }

    } else if (i > 0) {

        const prevParts = lines[i - 1].split(/[;\t]+/);
        const prev = parseGermanDate(prevParts[0]);

        if (prev) {
            intervalHours = (current - prev) / 3600000;
        }
    }
}
    // Leistung -> Energie
    if (unit === "kW") {
    
        energyMWh += values[i] * intervalHours / 1000;
    
    } else if (unit === "MW") {
    
        // Stundenlastgang in MW: gleiche Energie wie bei Einheit MWh
        energyMWh += values[i] * intervalHours;
    
    } else {
    
        // kWh / MWh sind bereits Energie
        energyMWh += values[i];
    }
}

const convertedToMWh = energyMWh;
    
const mwhDecimals = 3;

if (unit === "kW") {

    display =
        convertedToMWh.toLocaleString("de-DE", {
            minimumFractionDigits: mwhDecimals,
            maximumFractionDigits: mwhDecimals
        }) +
        " MWh";

} else if (unit === "MW") {

    // Bei Stundenlastgang exakt dieselbe Summe wie MWh anzeigen
    display =
        convertedToMWh.toLocaleString("de-DE", {
            minimumFractionDigits: mwhDecimals,
            maximumFractionDigits: mwhDecimals
        }) +
        " MWh";

} else if (unit === "kWh") {

    display =
        (result / 1000).toLocaleString("de-DE", {
            minimumFractionDigits: mwhDecimals,
            maximumFractionDigits: mwhDecimals
        }) +
        " MWh";

} else if (unit === "MWh") {

    display =
        result.toLocaleString("de-DE", {
            minimumFractionDigits: mwhDecimals,
            maximumFractionDigits: mwhDecimals

function extractYearFromDate(value) {

    if (!isDateValue(value)) {
        return null;
    }

    // Excel-Dateumszahl
    if (typeof value === "number") {

        const excelEpoch =
            new Date(
                (value - 25569) * 86400 * 1000
            );

        return excelEpoch.getFullYear();
    }

    const str = String(value).trim();

    const match =
        str.match(/(20\d{2})/);

    return match
        ? parseInt(match[1])
        : null;
}

function parseGermanDate(str) {

    str = String(str).trim();

    const monthly =
        str.match(/^(\d{1,2})\.(\d{4})$/);

    if (monthly) {
        return new Date(
            Number(monthly[2]),
            Number(monthly[1]) - 1,
            1
        );
    }

    const monthlyName =
        str.match(
            /^(Jan|Feb|Mär|Mar|Apr|Mai|Jun|Jul|Aug|Sep|Sept|Okt|Oct|Nov|Dez|Dec)\.?\s*(\d{4})$/i
        );
    
    if (monthlyName) {
    
        const months = {
            jan:0,
            feb:1,
            mär:2,
            mar:2,
            apr:3,
            mai:4,
            jun:5,
            jul:6,
            aug:7,
            sep:8,
            sept:8,
            okt:9,
            oct:9,
            nov:10,
            dez:11,
            dec:11
        };
    
        return new Date(
            Number(monthlyName[2]),
            months[monthlyName[1].toLowerCase()],
            1
        );
    }
    
    const monthName =
        str.match(/^(Jan|Feb|Mär|Mar|Apr|Mai|Jun|Jul|Aug|Sep|Okt|Oct|Nov|Dez|Dec)\s+(\d{2})$/i);

    if (monthName) {

        const months = {
            jan:0,
            feb:1,
            mär:2,
            mar:2,
            apr:3,
            mai:4,
            jun:5,
            jul:6,
            aug:7,
            sep:8,
            okt:9,
            oct:9,
            nov:10,
            dez:11,
            dec:11
        };

        return new Date(
            2000 + Number(monthName[2]),
            months[monthName[1].toLowerCase()],
            1
        );
    }

    const m = str.match(
        /^(\d{2})\.(\d{2})\.(\d{4})(?:\s+(\d{2}):(\d{2}))?$/
    );

    if (!m) return null;

    return new Date(
        Number(m[3]),
        Number(m[2]) - 1,
        Number(m[1]),
        Number(m[4] || 0),
        Number(m[5] || 0)
    );
}
            
function isDstChangeDay(date) {

    const month = date.getMonth() + 1;

    // Zeitumstellung findet nur im März oder Oktober statt
    if (month !== 3 && month !== 10) {
        return false;
    }

    const d = new Date(date);

    const offset0 = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0).getTimezoneOffset();
    const offset23 = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23).getTimezoneOffset();

    return offset0 !== offset23;
}
            
function detectGranularity(rows) {



    const diffs = [];

    for (let i = 1; i < Math.min(rows.length, 20); i++) {

        const row0 = Array.isArray(rows[i - 1])
            ? rows[i - 1]
            : String(rows[i - 1]).split(/[;\t]+/);
        
        const row1 = Array.isArray(rows[i])
            ? rows[i]
            : String(rows[i]).split(/[;\t]+/);
        
        const d0 = row0[0] instanceof Date
            ? row0[0]
            : parseGermanDate(String(row0[0]));
        
        const d1 = row1[0] instanceof Date
            ? row1[0]
            : parseGermanDate(String(row1[0]));

        if (!d0 || !d1) continue;

        diffs.push((d1 - d0) / 60000);
    }

    if (!diffs.length) {
        return { type: "unknown", chartMode: "day" };
    }

    const median =
        diffs.sort((a,b) => a-b)[Math.floor(diffs.length/2)];

    if (Math.abs(median - 60) < 1) {
        return { type: "1h", chartMode: "hour" };
    }

    if (Math.abs(median - 1440) < 5) {
        return { type: "1D", chartMode: "day" };
    }

    const days = median / 1440;

    if (days >= 28 && days <= 31.5) {
        return { type: "1M", chartMode: "month" };
    }

    return { type: "unknown", chartMode: "day" };
}

function normalizeMonthlyProfiles(text) {

    // erkennt: "Jan 27 13,903 Feb 27 13,408 ..."
    const regex = /([A-Za-zÄÖÜäöü]{3}\s?\d{2})\s+([\d.,]+)/g;

    if (!regex.test(text)) {
        return text;
    }

    const matches = [...text.matchAll(regex)];

    if (matches.length === 0) {
        return text;
    }

    return matches
        .map(m => `${m[1]}\t${m[2]}`)
        .join("\n");
}

                years: Array.from(document.querySelector('select[name="years"]').selectedOptions).map(o => o.value),
                einheit: document.querySelector('select[name="unit"]').value,
                forward_market_share: document.querySelector('input[name="forward_market_share"]').value,
                selection_mode: document.querySelector('[name="selection_mode"]').value,
                raw_input: document.querySelector('textarea[name="raw_input"]').value
            })
        });

        const result = await response.json();

        console.log("Excel gespeichert:", result);

        return result;

    } catch (error) {
        console.error(error);
        throw error;

    } finally {
        setUploadLoading(false);
    }
} 

async function runPricingSimulation() {

    const button =
        document.getElementById(
            "pricingButton"
        );

    button.disabled = true;

    try {

        await fetch(
            "./pricing/start",
            {
                method: "POST"
            }
        );

        let finished = false;

        while (!finished) {

            const response =
                await fetch(
                    "./pricing/status"
                );

            const status =
                await response.json();

            button.textContent =
                status.message || "Pricing läuft";

            if (status.error) {

                throw new Error(
                    status.error
                );
            }

            if (status.completed) {

                finished = true;
                break;
            }

            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        1000
                    )
            );
        }

        const resultResponse =
            await fetch(
                "./pricing/result"
            );

        const resultData =
            await resultResponse.json();

        const result =
            resultData.result;

        document.getElementById(
            "kpiPrice"
        ).textContent =
            result.price;

        document.getElementById(
            "kpiAmount"
        ).textContent =
            result.amount;

        document.getElementById(
            "kpiValidity"
        ).textContent =
            result.validity;

        document.getElementById(
            "kpiPSR"
        ).textContent =
            result.psr;

        button.textContent =
            "Abgeschlossen";

        button.classList.remove(
            "btn-primary"
        );

        button.classList.add(
            "btn-success"
        );

    } catch (error) {

        console.error(error);

        button.textContent =
            "Fehler";

        button.classList.remove(
            "btn-primary"
        );

        button.classList.add(
            "btn-danger"
        );
    }

    button.disabled = false;
}
            
const form = document.querySelector("form");

form.addEventListener("submit", async function (e) {

    e.preventDefault();

    if (!uploadCompleted || !lastgangLocked) {

        alert(
            "Bitte zuerst den Upload-Button betätigen."
        );

        return;
    }

    if (periodMismatch) {

        showModal(
            "Hinweis",
            "Lieferzeitraum und Lastgangzeitraum stimmen nicht überein."
        );

        return;
    }

    await runPricingSimulation();
});
